# Generates Dart FFI bindings from the engine's C header.
#   dart run ffigen
name: VocaraEngineBindings
description: Dart bindings to the native vocara_engine C ABI.
output: 'lib/data/ffi/vocara_engine_bindings.dart'
headers:
  entry-points:
    - 'rust/vocara_engine/include/vocara_engine.h'
  include-directives:
    - '**vocara_engine.h'
functions:
  include:
    - 've_.*'
structs:
  include:
    - 'Ve.*'
llvm-path:
  - '/Library/Developer/CommandLineTools/usr/lib'
  - '/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib'
preamble: |
  // GENERATED by package:ffigen — do not edit by hand.
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
  // ignore_for_file: unused_element, unused_field, constant_identifier_names
comments:
  style: any
  length: full
