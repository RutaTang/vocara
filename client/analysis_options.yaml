# Strict static analysis configuration for Vocara.
#
# Builds on the recommended Flutter lint set with the analyzer's strict
# language modes and a curated set of additional lint rules.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  exclude:
    # Generated code is excluded from analysis outright.
    - lib/data/db/app_database.g.dart
    - lib/data/ffi/vocara_engine_bindings.dart

linter:
  rules:
    unawaited_futures: true
    avoid_dynamic_calls: true
    prefer_single_quotes: true
    always_declare_return_types: true
    directives_ordering: true
    unnecessary_parenthesis: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
