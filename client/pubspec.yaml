name: vocara
description: "Vocara — a macOS app for singing practice notes and analysis"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI framework (lock to 0.17.x; 0.18+ requires Dart 3.11).
  forui: ^0.17.0

  # State management / dependency injection (per Flutter's official MVVM guide).
  provider: ^6.1.5

  # Routing.
  go_router: ^14.8.1

  # Drag-and-drop files into the app (pure Dart, receives audio files).
  desktop_drop: ^0.7.1

  # Sandbox-safe writable directories + path joining.
  path_provider: ^2.1.5
  path: ^1.9.0

  # Waveform extraction (decodes via AVFoundation on macOS).
  just_waveform: ^0.0.7

  # FFT / STFT for the Voiceprint spectrogram + power spectrum (pure Dart).
  fftea: ^1.5.0

  # Frameless window + custom drag region (Electron-style title bar).
  window_manager: ^0.4.3

  # SHA-256 content hashing (the stem-separation cache is keyed by source song).
  crypto: ^3.0.6

  drift: ^2.20.0
  sqlite3: ^3.3.0
  sqlite3_flutter_libs: ^0.5.24

  # FFI to the native Rust audio engine (vocara_engine.framework).
  ffi: ^2.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_macos_video: ^1.1.4
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates Dart bindings from rust/vocara_engine/include/vocara_engine.h.
  ffigen: ^20.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    # The source-separation sidecar script, copied out and run as a subprocess.
    - assets/separation/separate.py
