[package]
name = "vocara_engine"
version = "0.1.0"
edition = "2021"
description = "Vocara real-time DAG audio engine (graph runtime + DSP nodes + transport)"
license = "MIT OR Apache-2.0"

[lib]
# rlib for the offline-render test/bench harness; cdylib/staticlib for the macOS FFI bridge.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
# The live OS audio path (cpal output, symphonia decode, VoiceProcessingIO mic+AEC). Gated so
# the DSP core + graph + transport build and test with zero external crates / no network.
device = [
    "dep:cpal",
    "dep:symphonia",
    "dep:objc2-audio-toolbox",
    "dep:objc2-core-audio",
    "dep:objc2-core-audio-types",
    "dep:objc2-core-foundation",
    "dep:rubato",
    "dep:libc",
]

[[example]]
# Hardware-in-the-loop verification (real CoreAudio streams, real mic):
# `cargo run --example hw_verify --features device`. Interactive/manual only —
# never part of `cargo test`.
name = "hw_verify"
required-features = ["device"]

[[example]]
name = "hw_probe"
required-features = ["device"]

[dependencies]
cpal = { version = "0.18", optional = true }
# Pinned to the mature 0.5 line (0.6 is a 2026 ground-up API rewrite); decode targets 0.5.
symphonia = { version = "0.5", optional = true, default-features = false, features = [
    "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "aiff", "caf", "alac",
] }

# macOS CoreAudio / AudioUnit FFI for the VoiceProcessingIO mic path (capture + echo
# cancellation). Same 0.3.2 versions cpal already resolves; we union in the extra modules
# (AudioComponent Find/New/Dispose, AudioOutputUnit Start/Stop) cpal doesn't enable.
objc2-audio-toolbox = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "AUComponent",
    "AudioComponent",
    "AudioOutputUnit",
    "AudioUnitProperties",
    "objc2-core-audio-types",
] }
objc2-core-audio = { version = "0.3", optional = true }
objc2-core-audio-types = { version = "0.3", optional = true }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CFString",
    "CFBase",
] }
rubato = { version = "4.0.0", optional = true }
# getrlimit/setrlimit for the engine's open-file budget (see ffi::raise_open_file_limit).
# Already in the graph through cpal; declared so the FFI can call it directly.
libc = { version = "0.2", optional = true }

[profile.release]
# Default panic = "unwind", NOT abort: every FFI entry point is wrapped in catch_unwind,
# and that guard only works when panics unwind. The old `panic = "abort"` made all those
# guards dead code — a panic anywhere below (e.g. symphonia's TimeBase asserting on a
# zero-sample-rate file) aborted the whole app instead of returning a decode error.
# Unwinding never crosses the C ABI: catch_unwind at the boundary is the contract.
lto = "fat"
codegen-units = 1
