name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# CI never mutates the repository; actions are pinned to commit SHAs.
permissions:
  contents: read

jobs:
  dart:
    name: Flutter format, analyze, test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          # Pinned to the stable release matching client/.metadata
          # (revision f6ff1529fd).
          flutter-version: 3.38.5
          cache: true
      - run: flutter pub get
      # integration_test too: analyze already covers it, and a directory the
      # format gate skips is a directory that drifts.
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  rust:
    name: Rust engine tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client/rust/vocara_engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          # Requested explicitly: the action installs the minimal profile, so
          # the fmt/clippy steps below would otherwise depend on whatever the
          # runner image happens to ship.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: client/rust/vocara_engine
      # Symmetric with the dart job's format + analyze + test: the rust side
      # had only `test`, so a formatting drift or a new clippy lint could land
      # unnoticed.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features device -- -D warnings
      # Both modes, like the release gate: plain `cargo test` skips the
      # feature-gated ffi/vpio/device modules, so only the device run
      # compiles the FFI surface.
      - run: cargo test --locked
      - run: cargo test --locked --features device

  # Compiles the macOS app itself (Swift runner, plugins, the native engine
  # build) on every change. The jobs above never build it and the e2e job
  # that does is manual, so a native compile error could merge unnoticed.
  # Build only: the TEST flavor the e2e suites run, in debug.
  macos-build:
    name: macOS app build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug --flavor test

  # The UI-driven e2e suites boot the full macOS app (TEST flavor, seeded
  # sandbox store) and take several minutes each, so they are manual-only:
  # Actions tab -> CI -> Run workflow. Mirrors `just e2e`.
  e2e:
    name: E2E journeys (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true
      - id: deps
        run: flutter pub get
      # Every suite runs once the app's dependencies are in, each reporting on
      # its own: one failing suite does not hide the ones after it. The job
      # still fails if any of them does.
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/home_settings_journey_test.dart -d macos --flavor test
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/technique_library_journey_test.dart -d macos --flavor test --dart-define=START=/techniques
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/detail_arrange_journey_test.dart -d macos --flavor test --dart-define=START=/song/E2EPRACTICESEED00000000000
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/technique_detail_journey_test.dart -d macos --flavor test --dart-define=START=/techniques/E2ETECHNIQUESEED0000000000
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/settings_journey_test.dart -d macos --flavor test --dart-define=START=/settings
      # The non-UI integration suites (native engine, real drift store, no
      # widget tree). Listed here for the same reason they are in `just e2e`:
      # a suite nothing runs is a suite that rots.
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/audio_pipeline_test.dart -d macos --flavor test
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/analysis_pipeline_test.dart -d macos --flavor test
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/persistence_roundtrip_test.dart -d macos --flavor test
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/sync_roundtrip_test.dart -d macos --flavor test
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/source_separation_test.dart -d macos --flavor test
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/technique_library_test.dart -d macos --flavor test
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter test integration_test/ui_journey_test.dart -d macos --flavor test
