name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# CI never mutates the repository; actions are pinned to commit SHAs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds once from scratch (plus the cache): incremental state is
  # dead weight there.
  CARGO_INCREMENTAL: "0"

jobs:
  # The whole app: the engine, the model, the store, the services and the
  # iced UI. Both feature modes: plain builds skip the engine's C ABI, the
  # CoreAudio device path, VoiceProcessingIO and the AVFoundation players
  # (all behind `device`), so only the device run compiles and tests them.
  rust:
    name: Rust format, lint, test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.99.1"
          # Requested explicitly: the action installs the minimal profile, so
          # the fmt/clippy steps below would otherwise depend on whatever the
          # runner image happens to ship.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      # --all-targets so tests and examples are linted too: a `#[cfg(test)]`
      # helper whose only caller sits behind `device` is dead code in the
      # no-feature build, which only this shape catches.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features vocara_app/device -- -D warnings
      # --no-fail-fast, and the device run even after a failed plain run: one
      # CI run reports every failing test in both modes, not just the first.
      - run: cargo test --locked --workspace --no-fail-fast
      - if: ${{ !cancelled() }}
        run: cargo test --locked --workspace --features vocara_app/device --no-fail-fast

  # The Lean 4 proofs of the core algorithms (rust/verification), and the
  # vectors the Rust tests replay: committed vectors that differ from what
  # the proved models compute would test the code against stale behaviour.
  lean:
    name: Lean proofs and vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          V="$(sed -n 's#^leanprover/lean4:v##p' rust/verification/lean-toolchain)"
          [ -n "$V" ] || { echo "::error::cannot read rust/verification/lean-toolchain"; exit 1; }
          curl -sSfL -o "$RUNNER_TEMP/lean.zip" \
            "https://github.com/leanprover/lean4/releases/download/v$V/lean-$V-linux.zip"
          unzip -q "$RUNNER_TEMP/lean.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-$V-linux/bin" >> "$GITHUB_PATH"
      - name: Build the proofs
        working-directory: rust/verification
        run: |
          set -euo pipefail
          lake build
          # A proof left as `sorry` builds (with a warning); none may ship.
          if grep -rnw sorry VocaraVerify; then
            echo "::error::unfinished proof"; exit 1
          fi
      - name: The committed vectors are what the models compute
        working-directory: rust/verification
        run: |
          set -euo pipefail
          lake exe vectors "$RUNNER_TEMP/vectors"
          diff -r vectors "$RUNNER_TEMP/vectors"

  # Builds the macOS app bundle itself (rust/packaging/macos/bundle.sh: the
  # device build, Info.plist, icon, ad-hoc signature) on every change. The
  # jobs above never assemble it. Debug, the TEST flavor; universal, so the
  # Intel slice shows what no runner can run: that the app loads on macOS
  # 10.15 (an x86_64 debug build on top of the arm64 one, not a release).
  macos-build:
    name: macOS app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Build the bundle
        id: bundle
        run: |
          APP="$(rust/packaging/macos/bundle.sh --flavor test --debug --universal)"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
      # The Intel slice's LC_BUILD_VERSION minos is 10.15 (the arm64 one's
      # 11.0), and both link only frameworks and libraries macOS 10.15 ships
      # (no UniformTypeIdentifiers).
      - name: Check it can load on macOS 10.15
        run: .github/scripts/macos-minimum-check.sh "${{ steps.bundle.outputs.app }}"

  # The release build runs unsandboxed under the hardened runtime, and its
  # first launch on a Mac where a sandboxed release (0.3.0 and earlier) ran
  # moves that release's library out of its App Sandbox container. The
  # release workflow checks both on the notarized app before publishing it.
  # This builds that same release configuration (prod, Release.entitlements,
  # the hardened runtime; signed ad hoc, since the Developer ID certificate
  # lives only in the release workflow) and runs the same checks
  # (.github/scripts/launch-check.sh): a fresh install, then an update from
  # the last sandboxed release's DMG. Manual: a release build takes a while.
  #
  # The update's container is made by that release, which is Developer ID
  # signed; this build is not. macOS 14 and later guard a sandboxed app's
  # container from other apps ("App Data") and may not take an ad-hoc build
  # for its owner: the release workflow's run of the same check, on the
  # notarized build (the same team), is the one that proves the move on a
  # real update. A failure here that the check puts down to that protection
  # is the signature, not the move.
  release-launch:
    name: Release launch and update (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin
      - name: Build the prod release bundle, signed ad hoc
        id: bundle
        run: echo "app=$(rust/packaging/macos/bundle.sh --flavor prod)" >> "$GITHUB_OUTPUT"
      - name: Launch it and check it boots unsandboxed, under the hardened runtime
        run: .github/scripts/launch-check.sh "${{ steps.bundle.outputs.app }}"
      # An update starts from no library outside the container: the fresh
      # install's goes first.
      - name: Update to it from the last sandboxed release and check the library moved
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Application Support/com.rutatang.vocara"
          .github/scripts/launch-check.sh --update "${{ steps.bundle.outputs.app }}"
