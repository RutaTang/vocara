name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# CI never mutates the repository; actions are pinned to commit SHAs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds once from scratch (plus the cache): incremental state is
  # dead weight there.
  CARGO_INCREMENTAL: "0"

jobs:
  # The whole app: the engine, the model, the store, the services and the
  # iced UI. Both feature modes: plain builds skip the engine's C ABI, the
  # CoreAudio device path, VoiceProcessingIO and the AVFoundation players
  # (all behind `device`), so only the device run compiles and tests them.
  rust:
    name: Rust format, lint, test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.99.1"
          # Requested explicitly: the action installs the minimal profile, so
          # the fmt/clippy steps below would otherwise depend on whatever the
          # runner image happens to ship.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      # --all-targets so tests and examples are linted too: a `#[cfg(test)]`
      # helper whose only caller sits behind `device` is dead code in the
      # no-feature build, which only this shape catches.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features vocara_app/device -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --features vocara_app/device

  # The Lean 4 proofs of the core algorithms (rust/verification), and the
  # vectors the Rust tests replay: committed vectors that differ from what
  # the proved models compute would test the code against stale behaviour.
  lean:
    name: Lean proofs and vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          V="$(sed -n 's#^leanprover/lean4:v##p' rust/verification/lean-toolchain)"
          [ -n "$V" ] || { echo "::error::cannot read rust/verification/lean-toolchain"; exit 1; }
          curl -sSfL -o "$RUNNER_TEMP/lean.zip" \
            "https://github.com/leanprover/lean4/releases/download/v$V/lean-$V-linux.zip"
          unzip -q "$RUNNER_TEMP/lean.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-$V-linux/bin" >> "$GITHUB_PATH"
      - name: Build the proofs
        working-directory: rust/verification
        run: |
          set -euo pipefail
          lake build
          # A proof left as `sorry` builds (with a warning); none may ship.
          if grep -rnw sorry VocaraVerify; then
            echo "::error::unfinished proof"; exit 1
          fi
      - name: The committed vectors are what the models compute
        working-directory: rust/verification
        run: |
          set -euo pipefail
          lake exe vectors "$RUNNER_TEMP/vectors"
          diff -r vectors "$RUNNER_TEMP/vectors"

  # Builds the macOS app bundle itself (rust/packaging/macos/bundle.sh: the
  # device build, Info.plist, icon, ad-hoc signature) on every change. The
  # jobs above never assemble it. Debug, the TEST flavor.
  macos-build:
    name: macOS app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: rust/packaging/macos/bundle.sh --flavor test --debug

  # The shipping build is the only one with the App Sandbox on, and the
  # release workflow first launches it once it is notarized, at the end of a
  # tagged release. This builds that same release configuration (prod,
  # Release.entitlements, signed ad hoc since the Developer ID certificate
  # lives only in the release workflow) and launches it with the same checks
  # (.github/scripts/launch-check.sh). Manual: a release build takes a while.
  sandbox-launch:
    name: Sandboxed release launch (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin
      - name: Build the prod release bundle, signed ad hoc
        id: bundle
        run: echo "app=$(rust/packaging/macos/bundle.sh --flavor prod)" >> "$GITHUB_OUTPUT"
      - name: Launch it and check it boots inside its sandbox
        run: .github/scripts/launch-check.sh "${{ steps.bundle.outputs.app }}"
