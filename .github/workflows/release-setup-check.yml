# Checks the release pipeline's external setup without building or
# publishing anything: the public releases repo and the RELEASES_TOKEN
# secret, as the Release workflow's guard checks them before a release
# (.github/scripts/releases-repo-check.sh; its write check creates a draft
# release there and deletes it at once). Manual only: run it after setting
# up or renewing the token (docs/release-runbook.md).
name: Release setup check

on:
  workflow_dispatch:

env:
  # The same repo release.yml publishes to (both pinned to the app's update
  # manifest by rust/crates/vocara_services/tests/update_check_pins.rs).
  RELEASES_REPO: RutaTang/vocara-releases

permissions:
  contents: read

jobs:
  check:
    name: Verify the public releases repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: .github/scripts/releases-repo-check.sh
