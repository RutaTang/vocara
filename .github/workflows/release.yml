# Unified CD pipeline - triggered by version tags. GitHub Actions is the ONLY
# release path: build, deep re-sign, DMG, notarize, staple, and publish all
# happen here (no local release script).
#
# Phases:
#   0  Guard     - tag must sit on master HEAD and match the Rust workspace
#                  version (rust/Cargo.toml)
#   1  Validate  - fmt/clippy/tests over the whole Rust workspace in both
#                  feature modes, and the Lean proofs and their vectors
#   2  Build     - universal build (rust/packaging/macos/bundle.sh)
#                  -> Developer ID deep re-sign -> DMG
#                  -> notarize -> staple -> Gatekeeper assessment
#                  -> launch the app from the DMG, inside its sandbox
#   3  Publish   - the DMG + SHA256SUMS + latest.json (the in-app update
#                  check's manifest) as this public repo's GitHub release
#
# There is no backend deploy phase yet: sync is local-only P0 today. When the
# self-hosted sync server lands (P1, see docs/sync-protocol.md), its deploy
# jobs slot in between Validate and Build.
#
# Required repository secrets (setup steps in docs/release-runbook.md):
#   MACOS_CERTIFICATE           base64-encoded .p12 export of the
#                               'Developer ID Application: Weizhi Tang (TP7LCYW3NY)' cert
#   MACOS_CERTIFICATE_PASSWORD  password chosen when exporting the .p12
#   APPLE_ID                    Apple ID email of the developer account
#   APPLE_TEAM_ID               TP7LCYW3NY
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password from account.apple.com
# The release itself is published with the workflow's own GITHUB_TOKEN.
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The public repo users download from and the app's update check reads
  # (UpdateCheckService::MANIFEST_URL, pinned to this by
  # rust/crates/vocara_services/tests/update_check_pins.rs): this one. The
  # guard checks that it is the repo the workflow runs in, and public.
  RELEASES_REPO: RutaTang/vocara

# Least privilege by default; only the release job (which creates the GitHub
# release) is granted contents: write. Third-party actions are pinned to
# commit SHAs so a moved tag cannot inject code into a workflow that holds
# signing and notarization secrets.
permissions:
  contents: read

jobs:
  # ============================================================
  # Phase 0: Guard - tag on master HEAD, tag matches the workspace version
  # ============================================================
  guard:
    name: Verify Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify tag points to HEAD of master
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          MASTER_HEAD=$(git rev-parse origin/master)
          if [ "$TAG_COMMIT" != "$MASTER_HEAD" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_COMMIT) does not point to the HEAD of master ($MASTER_HEAD)."
            exit 1
          fi

      - name: Verify tag matches the workspace version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match the rust/Cargo.toml workspace version $VERSION."
            exit 1
          fi

      # Publishing comes after the whole build and notarization, so a repo
      # the app cannot read its updates from would otherwise surface only
      # then: the app reads the manifest without a login (and v0.1.0 reads
      # this repo's releases API), so the repo must be public.
      - name: Verify the releases repo is this public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASES_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::RELEASES_REPO ($RELEASES_REPO) is not this repository ($GITHUB_REPOSITORY)."
            exit 1
          fi
          PRIVATE="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)"
          if [ "$PRIVATE" != "false" ]; then
            echo "::error::$GITHUB_REPOSITORY must be public: the app reads its update manifest without a login."
            exit 1
          fi

  # ============================================================
  # Phase 1: Validate - nothing ships that CI would not pass
  # ============================================================
  validate-rust:
    name: Validate Rust
    needs: guard
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.99.1"
          # See ci.yml: the action installs the minimal profile, so the
          # fmt/clippy steps must ask for their components.
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all --check

      # BOTH feature modes, and --all-targets so tests and examples are linted
      # too: a `#[cfg(test)]` helper whose only caller sits behind `device` is
      # dead code in the no-feature build, which only this shape catches.
      - name: Clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --features vocara_app/device -- -D warnings

      # Both modes: plain `cargo test` skips the engine's C ABI, the device
      # paths and the AVFoundation players (feature-gated), so the device run
      # is the one that actually compiles and runs them. The app's journeys
      # (home, settings, technique library, song and technique pages) run in
      # these headless iced tests.
      - name: Tests
        run: |
          cargo test --locked --workspace --no-fail-fast
          cargo test --locked --workspace --features vocara_app/device --no-fail-fast

  validate-lean:
    name: Validate Lean proofs
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          V="$(sed -n 's#^leanprover/lean4:v##p' rust/verification/lean-toolchain)"
          [ -n "$V" ] || { echo "::error::cannot read rust/verification/lean-toolchain"; exit 1; }
          curl -sSfL -o "$RUNNER_TEMP/lean.zip" \
            "https://github.com/leanprover/lean4/releases/download/v$V/lean-$V-linux.zip"
          unzip -q "$RUNNER_TEMP/lean.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-$V-linux/bin" >> "$GITHUB_PATH"

      - name: Build the proofs
        working-directory: rust/verification
        run: |
          set -euo pipefail
          lake build
          if grep -rnw sorry VocaraVerify; then
            echo "::error::unfinished proof"; exit 1
          fi

      - name: The committed vectors are what the models compute
        working-directory: rust/verification
        run: |
          set -euo pipefail
          lake exe vectors "$RUNNER_TEMP/vectors"
          diff -r vectors "$RUNNER_TEMP/vectors"

  # ============================================================
  # Phase 2: Build - universal, signed, notarized, stapled DMG
  # ============================================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [validate-rust, validate-lean]
    outputs:
      dmg_name: ${{ steps.package.outputs.dmg_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
      size: ${{ steps.package.outputs.size }}
    env:
      APP_PATH: dist-app/vocara.app
      ENTITLEMENTS: rust/packaging/macos/Release.entitlements
      SIGN_IDENTITY: Developer ID Application
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Import Developer ID certificate into a throwaway keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -q "Developer ID Application" \
            || { echo "::error::Developer ID Application certificate not found in the imported .p12."; exit 1; }

      - name: Build universal prod release
        run: |
          set -euo pipefail
          rust/packaging/macos/bundle.sh --flavor prod --universal --out dist-app
          [ -d "$APP_PATH" ] \
            || { echo "::error::expected app bundle missing: $APP_PATH"; exit 1; }

      # The app (engine linked in) must be fat, or Intel users get a dead
      # app. Hard-fail rather than ship a broken DMG.
      - name: Verify the universal binary
        run: |
          set -euo pipefail
          lipo -info "$APP_PATH/Contents/MacOS/vocara"
          lipo "$APP_PATH/Contents/MacOS/vocara" -verify_arch x86_64 arm64 \
            || { echo "::error::not universal: $APP_PATH/Contents/MacOS/vocara"; exit 1; }

      # LSMinimumSystemVersion is 10.15: the Intel slice must be built for
      # it and link only what 10.15 ships (CI checks a debug build the same
      # way; this is the binary that ships).
      - name: Check it can load on macOS 10.15
        run: .github/scripts/macos-minimum-check.sh "$APP_PATH"

      # Hardened runtime + secure timestamp on every Mach-O, innermost first,
      # so the outer seals stay valid. Required for notarization. The Rust
      # app ships one statically linked executable today; the loops keep any
      # framework, dylib or helper bundled later signed the same way.
      - name: Deep re-sign (hardened runtime + timestamp), inside-out
        run: |
          set -euo pipefail
          sign() { codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" "$@"; }

          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            # 1) Loose dylibs nested inside frameworks.
            while IFS= read -r -d '' bin; do
              sign "$bin"
            done < <(find "$APP_PATH/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" \) -print0)

            # 2) The framework bundles themselves.
            while IFS= read -r -d '' fw; do
              sign "$fw"
            done < <(find "$APP_PATH/Contents/Frameworks" -maxdepth 1 -name "*.framework" -print0)
          fi

          # 3) Any bundled helper executables (none today; harmless if absent).
          for dir in "$APP_PATH/Contents/Helpers" "$APP_PATH/Contents/XPCServices"; do
            [ -d "$dir" ] || continue
            while IFS= read -r -d '' bin; do
              sign "$bin"
            done < <(find "$dir" -type f -perm +111 -print0)
          done

          # 4) The app itself, last, with its sandbox entitlements.
          sign --entitlements "$ENTITLEMENTS" "$APP_PATH"

      - name: Verify signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          # BOTH must hold, so test them separately: one alternation grep
          # passed when either line matched (a Developer ID signature without
          # the runtime flag, or an ad-hoc one with it).
          SIG="$(codesign --display --verbose=2 "$APP_PATH" 2>&1)"
          grep -q "Authority=Developer ID" <<<"$SIG" && grep -qE "flags=.*runtime" <<<"$SIG" \
            || { echo "::error::app is not Developer ID signed with hardened runtime"; exit 1; }

      - name: Create and sign DMG
        id: dmg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="dist/Vocara-$VERSION.dmg"
          mkdir -p dist
          STAGE="$(mktemp -d)"
          ditto "$APP_PATH" "$STAGE/vocara.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Vocara" -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov "$DMG"
          rm -rf "$STAGE"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          NOTARY_ARGS=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")

          # notarytool's exit code is not reliable across Xcode versions for a
          # rejected submission, so check the reported status explicitly and
          # fetch the log on failure. `|| true`: under pipefail a non-zero
          # exit would end the script here, before the status check and the
          # log fetch below ever ran.
          SUBMIT_LOG="$(mktemp)"
          xcrun notarytool submit "${{ steps.dmg.outputs.dmg }}" "${NOTARY_ARGS[@]}" --wait 2>&1 | tee "$SUBMIT_LOG" || true
          if ! grep -q "status: Accepted" "$SUBMIT_LOG"; then
            # `|| true`: a failure that printed no id (auth, network) must still reach the
            # error below instead of ending the script on grep's no-match under pipefail.
            SUBMISSION_ID=$(grep -m1 "id:" "$SUBMIT_LOG" | awk '{print $2}' || true)
            echo "::error::Notarization not accepted; log follows."
            [ -n "$SUBMISSION_ID" ] && xcrun notarytool log "$SUBMISSION_ID" "${NOTARY_ARGS[@]}" || true
            exit 1
          fi

      - name: Staple and Gatekeeper assessment
        run: |
          set -euo pipefail
          xcrun stapler staple "${{ steps.dmg.outputs.dmg }}"
          spctl --assess --type open --context context:primary-signature -v "${{ steps.dmg.outputs.dmg }}" \
            || { echo "::error::Gatekeeper rejected the stapled DMG"; exit 1; }

      # The notarized app is the one users get, and the only build with the
      # App Sandbox on and this signature: launched here, from the stapled
      # DMG, before anything is published (see .github/scripts/launch-check.sh;
      # CI's manual sandbox-launch job runs the same checks on an ad-hoc
      # build). A release that cannot start fails here.
      - name: Launch the notarized app from the DMG
        run: |
          set -euo pipefail
          MOUNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "${{ steps.dmg.outputs.dmg }}"
          trap 'hdiutil detach "$MOUNT" -force || true' EXIT
          .github/scripts/launch-check.sh "$MOUNT/vocara.app"

      - name: Checksum and Package Outputs
        id: package
        run: |
          set -euo pipefail
          DMG_FILE="${{ steps.dmg.outputs.dmg }}"
          SHA256=$(shasum -a 256 "$DMG_FILE" | cut -d ' ' -f 1)
          SIZE=$(stat -f%z "$DMG_FILE")
          {
            echo "dmg_name=$(basename "$DMG_FILE")"
            echo "sha256=${SHA256}"
            echo "size=${SIZE}"
          } >> "$GITHUB_OUTPUT"
          (cd dist && shasum -a 256 ./*.dmg > SHA256SUMS)

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

      - name: Summary
        run: |
          {
            echo "## macOS Build"
            echo "- **Tag**: $GITHUB_REF_NAME"
            echo "- **DMG**: ${{ steps.package.outputs.dmg_name }}"
            echo "- **Size**: ${{ steps.package.outputs.size }} bytes"
            echo "- **SHA256**: ${{ steps.package.outputs.sha256 }}"
            echo "- Universal (arm64 + x86_64), Developer ID signed, notarized, stapled"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # Phase 3: Publish - the GitHub release with DMG + checksums + manifest
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-macos
    # The only job that mutates the repository (creates the release).
    permissions:
      contents: write
    steps:
      # First: checkout empties the workspace. Only the tag's message is used.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download macOS DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-dmg
          path: artifacts

      # The notes are the tag's own message (`git tag -a`), empty for a
      # lightweight tag: the release's body, which v0.1.0's update check
      # shows (it reads this repo's releases API), and latest.json's notes.
      # latest.json links the release page.
      - name: Write the update manifest
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          git fetch --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES=""
          if [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then
            NOTES="$(git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG")"
          fi
          printf '%s\n' "$NOTES" > artifacts/notes.md
          jq -n --arg latest "${TAG#v}" \
            --arg url "https://github.com/$RELEASES_REPO/releases/tag/$TAG" \
            --arg notes "$NOTES" \
            '{latest: $latest, url: $url, notes: $notes}' > artifacts/latest.json
          cat artifacts/latest.json

      # GitHub serves releases/latest/download/latest.json (and the
      # releases/latest API v0.1.0 reads) from the newest release that is
      # not a prerelease, so a `-` tag never reaches the update check.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vocara ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: artifacts/notes.md
          files: |
            artifacts/*.dmg
            artifacts/SHA256SUMS
            artifacts/latest.json

      - name: Summary
        run: |
          {
            echo "## GitHub Release Created"
            echo "- **Version**: $GITHUB_REF_NAME"
            echo "- **Release**: https://github.com/$RELEASES_REPO/releases/tag/$GITHUB_REF_NAME"
            echo "- **DMG**: ${{ needs.build-macos.outputs.dmg_name }}"
            echo "- **SHA256**: ${{ needs.build-macos.outputs.sha256 }}"
          } >> "$GITHUB_STEP_SUMMARY"
