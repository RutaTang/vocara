# Vocara in Rust (see PORTING.md): the real-time audio engine, the domain
# model, the store (SQLite library + sync), the services (audio, analysis,
# settings), and the iced application.
[workspace]
resolver = "2"
members = ["crates/*"]
# Patched third-party crates (vendor/README.md), not members.
exclude = ["vendor"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
vocara_model = { path = "crates/vocara_model" }
vocara_store = { path = "crates/vocara_store" }
vocara_services = { path = "crates/vocara_services" }
vocara_engine = { path = "crates/vocara_engine" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
dirs = "6"
rustfft = "6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "fs", "macros", "io-util"] }
# `advanced-shaping`: every text is shaped fully (kerned, as Flutter set
# it); iced's default shapes ASCII text glyph by glyph, with no kerning.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "image", "tokio", "advanced", "advanced-shaping", "x11", "wayland", "web-colors"] }
iced_test = "0.14"
# The wheel events' gestures (`iced_winit::gesture`, vendor/README.md); the
# same crate iced runs on.
iced_winit = { version = "0.14", default-features = false }
# The renderer behind `iced::Renderer`, for the compositing iced's widgets
# cannot ask for (its `effects`, vendor/README.md): a subtree at an
# opacity, a filtered backdrop.
iced_renderer = { version = "0.14", default-features = false }
lucide-icons = { version = "1.77", features = ["iced"] }
# The open and save panels off macOS only (vocara_services::file_panels).
# The portal backend alone: rfd's `wayland` feature only names a parent
# window, which no panel of the app's sets, and it would make the services'
# own build link the system's libwayland-client.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
tempfile = "3"
ureq = { version = "3", default-features = false }
libc = "0.2"
fancy-regex = "0.20"
md-5 = "0.10"
parking_lot = "0.12"
indexmap = "2"
png = "0.18"
bytes = "1.9"
# Word boundaries (UAX #29) for the text fields' right-click word selection;
# iced's own fields segment with it.
unicode-segmentation = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
# Default panic = "unwind", NOT abort: every engine C ABI entry point is
# wrapped in catch_unwind, and that guard only works when panics unwind. An
# abort profile made those guards dead code — a panic anywhere below (e.g.
# symphonia's TimeBase asserting on a zero-sample-rate file) aborted the
# whole app instead of returning a decode error.
lto = "fat"
codegen-units = 1

# See vendor/README.md: iced_wgpu's quads draw their border over their fill,
# and both renderers (with the fallback renderer that is `iced::Renderer`)
# composite a subtree as one layer at an opacity and filter the backdrop.
[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }
# See vendor/README.md: iced_winit hands the app each wheel event's gesture
# phases.
iced_winit = { path = "vendor/iced_winit" }
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
iced_renderer = { path = "vendor/iced_renderer" }
# See vendor/README.md: a face drawn at a fixed instance of its variation
# axes (the text toolbar's labels, in the system UI font at its optical
# size), its `trak` table left unapplied.
cosmic-text = { path = "vendor/cosmic-text" }
