[package]
name = "vocara_app"
description = "Vocara's desktop application, built with iced (ported from the Flutter client's lib/ui, main.dart and routing)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vocara"
path = "src/main.rs"

[features]
default = []
device = ["vocara_services/device"]

[dependencies]
vocara_model.workspace = true
vocara_store.workspace = true
vocara_services.workspace = true
iced.workspace = true
iced_winit.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs.workspace = true
lucide-icons.workspace = true
png.workspace = true
bytes.workspace = true
indexmap.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
iced_test.workspace = true
tempfile.workspace = true

# The app's AppKit paths on a real Mac (the open and save panels, Cmd+Q
# while a take is armed, the scroll phases the run loop reads off AppKit):
# AppKit wants the main thread, so `main` is each test's own (see the
# files).
[[test]]
name = "macos_file_panels"
harness = false

[[test]]
name = "macos_quit"
harness = false

[[test]]
name = "macos_scroll_phases"
harness = false

# What those tests drive AppKit with and make their events with (objc2
# 0.6's bindings, the versions vocara_services and the run loop use).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    # NSEvent's key-event constructor.
    "NSGraphicsContext",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSUserDefaults",
] }
# The panels test hands its steps to the main run loop in its common modes.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "CFRunLoop",
    "CFString",
] }
# The scroll-phases test makes its scroll events with Core Graphics.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventTypes",
] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
# The panels test reads a filter back as AppKit may report it (macOS 11+
# may give `allowedFileTypes` as type identifiers). Test-only: the app never
# links UniformTypeIdentifiers, which macOS 10.15 lacks.
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = [
    "std",
    "UTType",
] }

[lints]
workspace = true
