[package]
name = "vocara_services"
description = "Vocara's services: the audio engine bridge, playback, recording, analysis, separation, settings, diagnostics and update check (ported from the Flutter client's lib/data/services and data/ffi)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The live audio engine (CoreAudio output, VoiceProcessingIO mic, symphonia
# decode). macOS only: the engine's device path is Apple-specific. Without it
# the services run on the null engine, as the Dart unit tests run on fakes.
# It also turns on the technique example players' AVFoundation backend
# (media_player.rs); without it they are the null player.
device = [
    "vocara_engine/device",
    "objc2-av-foundation/AVPlayer",
    "objc2-av-foundation/AVPlayerItem",
    "objc2-av-foundation/AVPlayerItemOutput",
    "objc2-av-foundation/objc2-core-foundation",
    "objc2-av-foundation/objc2-core-media",
    "objc2-av-foundation/objc2-core-video",
    "dep:objc2-core-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
]

[dependencies]
vocara_model.workspace = true
vocara_store.workspace = true
vocara_engine.workspace = true
# The library's connection: Persistence opens it (busy wait, oplog hooks)
# before it becomes the store's AppDatabase.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
dirs.workspace = true
rustfft.workspace = true
tokio.workspace = true
libc.workspace = true
fancy-regex.workspace = true
md-5.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# The AppKit hooks (menu bar, delegate, terminate:) on a real Mac: AppKit
# wants the main thread, so `main` is the test's own (see the file).
[[test]]
name = "macos_gui"
harness = false

# What tests/macos_gui.rs builds its windows, fields and events with.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSControl",
    "NSGraphics",
    "NSPasteboard",
    "NSRunningApplication",
    "NSText",
    "NSTextField",
    "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDate",
    "NSRunLoop",
] }

# HTTPS for the update check: the system trust store on macOS (as Dart's
# HttpClient used), rustls elsewhere.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = { workspace = true, features = ["rustls", "gzip"] }

# The microphone permission prompt (AVFoundation), see mic_permission.rs,
# the quit requests and the menu bar (AppKit), see quit_request.rs and
# app_menu.rs, and the example players' AVPlayer backend (with `device`),
# see media_player.rs.
[target.'cfg(target_os = "macos")'.dependencies]
ureq = { workspace = true, features = ["native-tls", "gzip"] }
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "AVCaptureDevice",
    "AVMediaFormat",
] }
# The version rfd already brings in, for objc2 0.6 (winit's 0.2 pairs with
# objc2 0.5).
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    # NSEvent's key-event constructor (the menu's edit target).
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSWindow",
] }
# Not only with `device`: the menu bar needs it too.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSProcessInfo",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CFBase",
    "CFString",
    "CFDate",
] }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CMBase",
    "CMTime",
] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "objc2",
    "CVBase",
    "CVBuffer",
    "CVHostTime",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
