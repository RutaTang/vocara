[package]
name = "vocara_store"
description = "Vocara's library store: the SQLite database, the asset pool, sync, and the repositories (ported from client/lib/data/db, sync, repositories)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vocara_model.workspace = true
# hooks: the oplog-insert notifier behind SyncEngine::start (the Rust form
# of drift's tableUpdates stream).
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
dirs.workspace = true
libc.workspace = true
parking_lot.workspace = true
indexmap.workspace = true

[dev-dependencies]
tempfile.workspace = true
# trace: the sync tests count the statements a pull runs (drift's
# QueryInterceptor in the Dart tests).
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true
