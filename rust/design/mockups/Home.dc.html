<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>After · Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111114}
button{font-family:inherit}
.tn{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #111114; color: #ECECF1; font-family: Inter, -apple-system, system-ui, sans-serif; font-size: 12px; line-height: 16px; overflow: hidden; -webkit-font-smoothing: antialiased">

  <header style="height: 52px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 16px; background: #18181C; border-bottom: 1px solid #26262D">
    <div style="display: flex; gap: 8px; flex: none" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #3A3A42"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #3A3A42"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #3A3A42"></span>
    </div>
    <span style="margin-left: 10px; font-size: 13px; font-weight: 600">Vocara</span>
    <span style="flex: 1"></span>
    <button aria-label="New practice" title="New practice" style="width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: #A7A7B3; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3.5v17M3.5 12h17"></path></svg>
    </button>
    <button aria-label="Techniques" title="Techniques" style="width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: #A7A7B3; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5v17M10 3.5v17M14.6 4.2l4.9 16.1"></path></svg>
    </button>
    <button aria-label="Settings" style="width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: #A7A7B3; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="matrix(0.75 0 0 0.75 3 3)" stroke-width="2.4"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></g></svg>
    </button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: auto; padding: 28px 32px 32px">
    <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px">
      <h1 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 600">Practices</h1>
      <span style="font-size: 12px; color: #80808D" class="tn">8</span>
      <span style="flex: 1"></span>
      <span style="font-size: 11px; color: #80808D">Most recent first</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="8">
        <a href="#" aria-label="Open {{ p.title }}" style="display: flex; flex-direction: column; border-radius: 8px; background: {{ p.bg }}; box-shadow: inset 0 0 0 1px {{ p.edge }}{{ p.shadow }}; overflow: hidden; text-decoration: none; color: #ECECF1">
          <div style="height: 76px; position: relative; background: #0F0F12; border-bottom: 1px solid #222228">
            <sc-if value="{{ p.hasWave }}" hint-placeholder-val="{{ true }}">
              <svg viewBox="0 0 1000 60" preserveAspectRatio="none" style="position: absolute; left: 12px; right: 12px; top: 8px; width: calc(100% - 24px); height: 60px" aria-hidden="true">
                <line x1="0" x2="1000" y1="30" y2="30" stroke="#1E1E24" stroke-width="1" vector-effect="non-scaling-stroke"></line>
                <path d="{{ p.wave }}" fill="{{ p.waveColor }}"></path>
              </svg>
            </sc-if>
            <sc-if value="{{ p.empty }}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6E6E7A">No recordings yet</div>
            </sc-if>
            <span style="position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: #80808D" class="tn">{{ p.length }}</span>
          </div>
          <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.title }}</span>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 11px">
              <span style="color: #A7A7B3; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis" class="tn">{{ p.meta }}</span>
              <span style="color: #80808D; flex: none">{{ p.when }}</span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  wave(seed, density) {
    let s = seed;
    const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    const top = [];
    const bot = [];
    for (let x = 0; x <= 1000; x += 4) {
      const u = x / 1000;
      const phrase = Math.max(0, Math.sin(u * Math.PI * density + seed));
      const env = Math.min(1, u * 12) * Math.min(1, (1 - u) * 10);
      const a = env * (0.12 + phrase * (0.5 + 0.5 * r())) * 26;
      top.push(x + ' ' + (30 - Math.max(0.4, a)).toFixed(1));
      bot.push(x + ' ' + (30 + Math.max(0.4, a)).toFixed(1));
    }
    return 'M' + top.join(' L') + ' L' + bot.reverse().join(' L') + 'Z';
  }
  renderVals() {
    const defs = [
      ['River Song', 'Backing · 3 takes · 4 notes', 'Today', '0:48', '#D98C7E', 4, true],
      ['Audition cut — 16 bars', 'Backing · 3 takes · 3 notes', 'Today', '0:41', '#C9A46E', 6],
      ['Caro mio ben', 'Backing · no takes', 'Yesterday', '2:46', '#8C8C99', 9],
      ['Warm-up: sirens & lip trills', '6 takes · 1 note', 'Yesterday', '4:10', '#6FB39A', 12],
      ['Ave Maria (Schubert)', 'Backing · 1 take', 'Nov 24', '5:12', '#8FA3D9', 7],
      ['Defying Gravity — belt section', 'Backing · 2 takes · 5 notes', 'Nov 22', '1:05', '#D98C7E', 5],
      ['Hallelujah (lowered key)', 'Backing · 4 takes · 2 notes', 'Nov 21', '4:38', '#C9A46E', 8],
      ['Untitled practice', 'No takes yet', 'Nov 20', '', '#8C8C99', 0]
    ];
    const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(',');
    const projects = defs.map(([title, meta, when, length, color, density, hover], i) => ({
      title, meta, when, length,
      hasWave: density > 0, empty: density === 0,
      wave: density > 0 ? this.wave(i + 3, density) : '',
      waveColor: 'rgba(' + rgb(color) + ',0.85)',
      bg: hover ? '#1C1C21' : '#18181C',
      edge: hover ? '#3A3A43' : '#26262D',
      shadow: hover ? ', 0 6px 16px rgba(0,0,0,0.35)' : ''
    }));
    return { projects };
  }
}
</script>
</body>
</html>
